<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>부광고ON</title>
    <script>
      // GitHub Pages는 없는 주소로 들어오면 이 파일을 보여줍니다.
      // 이 앱은 주소(URL)로 화면을 나누지 않는 단일 페이지 앱이므로 앱 첫 화면으로 되돌려 보냅니다.
      //
      // ▼ 저장소 이름이 movingclass가 아니면 이 한 줄만 바꾸세요.
      //   (사용자 페이지 username.github.io 로 쓸 경우에는 "" 로 비워 두세요.)
      var REPO = "movingclass";

      var base = REPO ? "/" + REPO + "/" : "/";
      if (location.pathname !== base) location.replace(base);
    </script>
  </head>
  <body>
    <p>앱으로 이동 중입니다… <a href="/movingclass/">부광고ON 열기</a></p>
  </body>
</html>
