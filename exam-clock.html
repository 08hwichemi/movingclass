<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모의고사 시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="./supabase-js.js"></script>   <!-- 앱과 같은 supabase-js (node_modules 의 UMD 빌드를 복사). CDN 에 기대지 않는다 -->
<style>
/* ─────────────────────────────────────────────────────────────
   빔 프로젝터용 모의고사 시계(아날로그) + 출석 안내
   아날로그 시계는 예비령(10분 전)~시험 종료 동안만 '수능 시각'(그 과목 수능 시작 시각에 맞춘 시각)으로 나오고,
   그 밖에는 감추고 큰 숫자 시계(현재 시각). 시험 중에는 시계 아래 작게 실제 시각(2026-10-17 학생 요청). 남은 시간 글씨는 넣지 않는다.
   노트북에서 이 파일을 더블클릭 → 화면을 한 번 클릭(종소리 켜기) → F 키(전체화면)
   시계·종소리는 인터넷이 없어도 돌아간다. 시간은 노트북 시계를 따른다.
   출석 안내 칸의 '안 누른 학생 명단'(v100)만 부광고ON 서버를 읽는다 — 교직원 계정으로 한 번 로그인하면
   기기에 남는다. 안내 시간 동안 30초마다 한 번씩만 받고(실시간 없음), 전원이 누르면 그 교시는 더 안 받는다.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#000; --ink:#F2F2F2; --sub:#C3C8C5; --line:#2A2F2C;
  --ready:#7FD3FF; --warn:#FFC23D; --end:#FF6B5B; --rest:#9FD9B0;
  --yellow:#FFD23F;
  --accent:#4FC3F7;   /* 지금 과목: 제목·네모칸·시계 테두리를 같은 하늘색으로 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;   /* 앱과 같은 글씨체 */
  -webkit-font-smoothing:antialiased;cursor:default;user-select:none}

/* 가로 네 칸: 시계 2칸 · 교시 안내 1칸 · 출석 안내 1칸 */
#app{position:fixed;inset:0;display:grid;grid-template-columns:2fr 1fr 1fr;gap:2vw;padding:3vh 2.4vw;align-items:center}
#clockCol{display:flex;align-items:center;justify-content:center;min-width:0}
#dialWrap{width:100%;max-height:94vh;aspect-ratio:1;justify-self:center;display:flex;align-items:center;justify-content:center}
#dial{height:100%;width:100%;display:block}

/* 교시 안내 칸 */
#side{--k:1;height:94vh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:calc(1.4vh * var(--k));min-width:0}
/* 제목·상태 글씨는 칸 너비에 맞춰 최대한 크게 (fit() 가 줄인다) */
#head,#head2,#kicker,#title{white-space:nowrap;overflow:hidden;width:100%}
#head{color:var(--sub);font-weight:800;line-height:1.2}
#head2{color:var(--ink);font-weight:900;line-height:1.2}
#kicker{font-weight:900;line-height:1.2;padding:.08em 0}
/* 지금 상태를 상자로: 시험 중 = 분홍 바탕·빨간 글씨, 휴식 중 = 연두 바탕·초록 글씨 */
#kicker .badge{display:inline-block;padding:.06em .45em;border-radius:.28em;letter-spacing:.02em}
#kicker .note{margin-left:.35em;color:var(--warn);font-weight:800}
#kicker .note.calm{color:var(--rest)}
.b-exam{background:#FFD0DC;color:#D50000}
.b-rest{background:#CFEFD9;color:#1B5E32}
.b-ready{background:#CDEBFA;color:#0B4F72}
.b-ended{background:#FFD0DC;color:#D50000}
.b-done{background:#3A3F3C;color:#F2F2F2}
#title{font-weight:900;line-height:1.15;color:var(--accent)}
#sub{font-size:calc(min(3.4vh,1.8vw) * var(--k));color:var(--sub);font-weight:700;word-break:keep-all;line-height:1.45}
#sub b{color:var(--ink)}
.s-done #title{color:var(--rest)}

/* 과목 네모 네 개 */
#strip{display:flex;flex-direction:column;gap:calc(1.2vh * var(--k))}
#strip div{border:.35vh solid var(--line);border-radius:1.4vh;padding:calc(.8vh * var(--k)) .6vw;text-align:center;color:var(--ink);font-size:calc(min(3.6vh,1.9vw) * var(--k));font-weight:800;line-height:1.3}
#strip div b{display:block;font-size:calc(min(4.6vh,2.4vw) * var(--k));font-weight:900;color:var(--ink);line-height:1.25}
#strip div.on{border-color:var(--accent);border-width:.6vh;background:#0B2533;color:var(--accent)}
#strip div.on b{color:var(--accent)}
#strip div.past{opacity:.3}
#strip div i{display:block;font-style:normal;font-size:.62em;font-weight:700;color:var(--sub)}
#sub small{font-size:.75em;color:var(--sub)}


/* 출석 안내 칸 — 안내 시간이 아니면 비워 둔다 */
#attendCol{height:94vh;display:flex;align-items:center;min-width:0}
#attend{--k:1}
#attend{display:none;width:100%;height:94vh;border-radius:2.4vh;background:var(--yellow);color:#1A1400;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vh 1vw;gap:calc(2vh * var(--k));overflow:hidden}
#attend.on{display:flex;animation:blink 30s linear infinite}   /* 30초마다 두 번 깜빡 */
#attend .ic{font-size:calc(min(9vh,5vw) * var(--k));line-height:1}
#attend .p{font-size:calc(min(8vh,4.1vw) * var(--k));font-weight:900;line-height:1.15;word-break:keep-all}
#attend .m{font-size:calc(min(8vh,4.1vw) * var(--k));font-weight:900;line-height:1.2;word-break:keep-all}
#attend .u{font-size:calc(min(4vh,2.2vw) * var(--k));font-weight:800;opacity:.8}
/* 명단 모드 (서버에서 받았을 때). 위에서 아래로: 작은 머리 · 큰 숫자 · 이름(또는 안내) · 작은 바닥글 */
#attend.list{justify-content:flex-start;gap:0;padding:2.6vh 1.2vw}
#attend.list .ic,#attend.list .p,#attend.list .m,#attend.list .u{display:none}
#attend .hd,#attend .cnt,#attend .names,#attend .hint,#attend .ft{display:none}
#attend.list .hd{display:block;font-size:calc(min(3.6vh,1.9vw) * var(--k));font-weight:700;opacity:.85;line-height:1.2;margin-bottom:1.2vh}
#attend.list .cnt{display:block;font-size:calc(min(7vh,3.6vw) * var(--k));font-weight:700;line-height:1.1;margin-bottom:1.6vh;word-break:keep-all}
#attend.list .cnt b{font-size:1.45em;color:#B3261E;font-weight:700}
#attend.list .cnt.ok{color:#1B5E32}
#attend.list .names{display:grid;flex:1;width:100%;gap:.9vh .6vw;align-content:start;overflow:hidden}
#attend.list .names span{background:rgba(0,0,0,.08);border-radius:1.2vh;padding:.5vh .2vw;font-weight:700;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#attend.list .names.c1{grid-template-columns:1fr;font-size:calc(min(6.2vh,3.1vw) * var(--k))}
#attend.list .names.c2{grid-template-columns:1fr 1fr;font-size:calc(min(4.6vh,2.3vw) * var(--k))}
#attend.list .names.c3{grid-template-columns:1fr 1fr 1fr;font-size:calc(min(3.4vh,1.65vw) * var(--k))}
#attend.list .hint{display:flex;flex:1;align-items:center;justify-content:center;font-size:calc(min(6.4vh,3.2vw) * var(--k));font-weight:700;line-height:1.25;word-break:keep-all;text-align:center}
#attend.list .hint.ok{color:#1B5E32}
#attend.list .ft{display:block;font-size:calc(min(3.2vh,1.7vw) * var(--k));font-weight:600;opacity:.75;margin-top:1.4vh;line-height:1.3}
#attend.list .ft .err{color:#B3261E}

/* 시계 보는 법 — 출석 안내가 없을 때 그 자리에 (2026-10-17 시안) */
#guide{--k:1;display:none;width:100%;height:94vh;border:.4vh solid var(--line);border-radius:2.4vh;padding:0 1.2vw 2vh;
  flex-direction:column;text-align:center;overflow:hidden}
#guide.on{display:flex}
/* 제목은 맨 위 띠, 나머지 칸은 남은 높이에 고르게 펼친다 (2026-10-18 사용자: 가운데로 몰려 보였다) */
#guide .gt{font-size:calc(min(6vh,3vw) * var(--k));font-weight:900;color:var(--sub);line-height:1.2;padding:2.6vh 0 2.2vh;border-bottom:.3vh solid var(--line)}
#guide .gbody{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
#guide .gr+.gr,#guide .gn{border-top:.3vh solid var(--line);padding-top:calc(3vh * var(--k))}
#guide .gk{font-size:calc(min(5vh,2.5vw) * var(--k));font-weight:800;color:var(--sub);line-height:1.2}
#guide .gv{font-size:calc(min(9.5vh,4.5vw) * var(--k));font-weight:900;color:var(--ink);line-height:1.15}
#guide .acc{color:var(--accent)}
#guide .gk.acc{color:var(--accent);opacity:.8}
#guide .gd{font-size:calc(min(4.4vh,2.15vw) * var(--k));font-weight:700;color:var(--sub);line-height:1.35;margin-top:.8vh;word-break:keep-all}
#guide .gn{font-size:calc(min(4.8vh,2.3vw) * var(--k));font-weight:800;color:var(--warn);line-height:1.35;word-break:keep-all}
#guide .gn:empty{display:none}
#guide .gn b{color:var(--ink)}

/* 그날 하루 알림(QR) — '시계 보는 법' 자리에 (2026-10-23 모의고사 신청) */
#notice{display:none;width:100%;height:94vh;border:.4vh solid var(--accent);background:var(--accent);border-radius:2.4vh;padding:3vh 1.2vw;
  flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;overflow:hidden}
#notice.on{display:flex}
#notice .nt{font-size:min(8vh,3.6vw);font-weight:900;color:#06263A;line-height:1.15;word-break:keep-all}
#notice .nq{background:#fff;border-radius:1.6vh;padding:min(2.4vh,1.1vw);width:min(56vh,19vw);aspect-ratio:1}
#notice .nq svg{display:block;width:100%;height:100%}
#notice .ns{font-size:min(4.8vh,2.2vw);font-weight:800;color:#06263A;line-height:1.35;word-break:keep-all}
#notice .nu{font-size:min(2.8vh,1.25vw);font-weight:700;color:#0B4F72}

/* 로그인 창 — 명단을 읽으려면 교직원 계정이 필요하다. 한 번 들어가면 기기에 남는다 */
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:10}
#login.on{display:flex}
#login form{background:#15181A;border:1px solid #2A2F2C;border-radius:2vh;padding:4vh 3vw;width:min(520px,80vw);display:flex;flex-direction:column;gap:1.6vh}
#login h2{font-size:3.2vh;font-weight:700;color:var(--ink)}
#login p{font-size:2vh;color:var(--sub);line-height:1.5}
#login input{font:inherit;font-size:2.6vh;padding:1.4vh 1.2vw;border-radius:1.2vh;border:1px solid #3A3F3C;background:#0B0D0C;color:var(--ink)}
#login button{font:inherit;font-size:2.6vh;font-weight:700;padding:1.6vh;border-radius:1.2vh;border:0;background:#40694F;color:#fff;cursor:pointer}
#login .msg{font-size:2vh;color:var(--end);min-height:2.4vh}
@keyframes blink{0%,6%,100%{opacity:1}1.5%,4.5%{opacity:.12}}

/* 현재 시각(디지털, 실제 시각). 배치는 body 의 layout-a/b/c 가 정한다 */
#digital{display:flex;align-items:baseline;justify-content:center;gap:1.2vw;white-space:nowrap;font-variant-numeric:tabular-nums}
#digital .lb{color:var(--sub);font-weight:800}
#digital .tm{color:var(--ink);font-weight:800;letter-spacing:.02em}
#digital .ss{color:var(--sub);font-weight:700}
/* a: 오른쪽 교시 칸 맨 위 */
.layout-a #digital{flex-direction:column;align-items:flex-start;gap:0;border:.35vh solid var(--line);border-radius:1.6vh;padding:1vh 1vw}
.layout-a #digital .lb{font-size:calc(2.8vh * var(--k))}
.layout-a #digital .tm{font-size:calc(min(11vh,5.6vw) * var(--k));line-height:1}
.layout-a #digital .ss{display:none}
/* b: 시계 아래 */
.layout-b #clockCol{height:94vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;min-width:0}
.layout-b #dialWrap{max-height:78vh;height:min(78vh,44vw);width:auto}
/* '실제 시각' 글씨도 숫자와 같은 크기 (2026-10-17 사용자) — 화면이 좁아도 시계 칸 안에 들게 vw 로도 묶는다 */
.layout-b #digital .lb{font-size:min(10vh,4.2vw);line-height:1}
.layout-b #digital .tm{font-size:min(10vh,4.2vw);line-height:1}
.layout-b #digital .ss{font-size:min(5vh,2.1vw)}
/* 시험 시간 밖: 아날로그 시계판·작은 숫자 시계를 감추고 큰 숫자 시계 판(#bigClock) */
#bigClock{display:none}
.analog-off #dialWrap{display:none}
.analog-off #digital{display:none}
/* 원판: 아날로그 시계와 크기·자리를 똑같이 — 아래 '실제 시각' 줄 자리도 비워 둔 채로 남긴다 */
.bc-ring.analog-off #digital{display:flex;visibility:hidden}
.analog-off #bigClock{display:flex}
#bigClock{order:-1;position:relative;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
#bigClock .bc-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}
#bigClock .bc-date{color:var(--sub);font-weight:800}
#bigClock .bc-lb{color:var(--sub);font-weight:700}
#bigClock .bc-tm{color:var(--ink);font-weight:800;line-height:1;white-space:nowrap}
#bigClock .bc-ss{color:var(--sub);font-weight:700;font-size:.32em;margin-left:.15em}
#bigClock .bc-next{color:var(--rest);font-weight:800;word-break:keep-all}
#bigClock .bc-next b{color:var(--ink)}
/* 모양 1 'ring': 아날로그 시계와 같은 크기의 원판(눈금만) 안에 숫자 — 시험 때 같은 자리에 바늘 시계가 나온다 */
.bc-ring #bigClock{height:78vh;aspect-ratio:1}
.bc-ring #ring{position:absolute;inset:0;width:100%;height:100%}
.bc-ring #bigClock .bc-date{font-size:min(4.4vh,2.2vw)}
.bc-ring #bigClock .bc-lb{font-size:min(3.6vh,1.8vw);margin-top:1.6vh}
.bc-ring #bigClock .bc-tm{font-size:min(19vh,9.4vw);margin:.6vh 0 2vh}
.bc-ring #bigClock .bc-next{font-size:min(3.8vh,1.9vw);border-top:.3vh solid var(--line);padding-top:1.6vh}
/* 모양 2 'card': 둥근 네모 판 — 날짜 · 큰 시각 · 다음 시험 */
.bc-card #ring{display:none}
.bc-card #bigClock{--k:1;width:100%;height:94vh;border:.4vh solid var(--line);border-radius:2.4vh;background:#0B0D0C;overflow:hidden}
/* 칸 높이를 위·가운데·아래로 고르게 나눠 쓴다. 글씨는 멀리서 보이게 칸 너비에 맞춰 크게 (2026-10-18 사용자) */
.bc-card #bigClock .bc-in{width:100%;height:100%;justify-content:space-evenly;padding:2vh 1.5vw}
.bc-card #bigClock .bc-date{font-size:calc(min(8vh,3.7vw) * var(--k));color:var(--ink);line-height:1.15}
.bc-card #bigClock .bc-mid{display:flex;flex-direction:column;align-items:center}
.bc-card #bigClock .bc-lb{font-size:calc(min(5.6vh,2.6vw) * var(--k));line-height:1.1}
.bc-card #bigClock .bc-tm{font-size:calc(min(30vh,11.5vw) * var(--k));margin-top:.5vh}
.bc-card #bigClock .bc-next{border-top:.4vh solid var(--line);padding-top:2.4vh;width:88%;line-height:1.25}
.bc-card #bigClock .bc-next .n1{display:block;font-size:calc(min(9vh,4.2vw) * var(--k));font-weight:900;color:var(--rest)}
.bc-card #bigClock .bc-next .n2{display:block;font-size:calc(min(6vh,2.8vw) * var(--k));font-weight:800;color:var(--sub);margin-top:.6vh}
/* c: 화면 맨 위 가로줄 */
.layout-c #app{grid-template-rows:auto 1fr;padding-top:1.6vh}
.layout-c #topbar{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;border-bottom:.35vh solid var(--line);padding-bottom:1vh}
.layout-c #topbar .tb-l{color:var(--sub);font-weight:800;font-size:4vh}
.layout-c #digital .lb{font-size:3.6vh}
.layout-c #digital .tm{font-size:9vh;line-height:1}
.layout-c #digital .ss{font-size:4.6vh}
.layout-c #dialWrap{max-height:80vh}
.layout-c #side,.layout-c #attendCol{height:80vh}
.layout-c #attend{height:76vh}
.layout-c #head,.layout-c #head2{display:none}

#help kbd{border:1px solid var(--sub);border-radius:.6vh;padding:0 .7vh;font-family:inherit;color:var(--ink)}
#help{position:fixed;right:1.5vw;bottom:.6vh;font-size:1.8vh;color:#555;transition:opacity .6s}
#mute{position:fixed;left:1.5vw;bottom:.6vh;font-size:1.8vh;color:var(--end)}
#mode{position:fixed;left:50%;top:.6vh;transform:translateX(-50%);font-size:1.8vh;color:var(--warn)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" style="display:none"><div class="tb-l" id="tbTitle"></div><div id="digitalSlotC"></div></div>
  <div id="clockCol">
    <div id="dialWrap"><svg id="dial" viewBox="-110 -110 220 220" aria-label="시계"></svg></div>
    <div id="digitalSlotB"></div>
    <div id="bigClock">
      <svg id="ring" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
      <div class="bc-in">
        <div class="bc-date" id="bcDate"></div>
        <div class="bc-mid">
          <div class="bc-lb">현재 시각</div>
          <div class="bc-tm"><span id="bcTime"></span><span class="bc-ss" id="bcSec"></span></div>
        </div>
        <div class="bc-next" id="bcNext"></div>
      </div>
    </div>
  </div>
  <div id="side">
    <div id="digitalSlotA"></div>
    <div><div id="head"></div><div id="head2"></div></div>
    <div id="main">
      <div id="kicker"></div>
      <div id="title"></div>
      <div id="sub"></div>
    </div>
    <div id="strip"></div>
  </div>
  <div id="attendCol">
    <div id="guide">
      <div class="gt">시계 보는 법</div>
      <div class="gbody">
      <div class="gr"><div class="gk acc">아날로그 시계</div><div class="gv acc">수능 시각</div><div class="gd">예비령(10분 전)부터<br>시험 끝까지</div></div>
      <div class="gr"><div class="gk">숫자 시계</div><div class="gv">실제 시각</div><div class="gd">출석 · 쉬는 시간은<br>이 시각으로</div></div>
      <div class="gn" id="guideNote"></div>
      </div>
    </div>

let session = null;
let poll = null;   // { key, nextReal, done, inFlight, data, err }
const dateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

async function loadSettings() {
  if (!sb || !session) return;
  const { data, error } = await sb.from('settings').select('periods, globalemptyslots').eq('id', 'main').maybeSingle();
  if (error || !data || !Array.isArray(data.periods)) return;
  const blocked = Array.isArray(data.globalemptyslots) ? data.globalemptyslots : [];
  const w = {};
  for (const day of ['월', '화', '수', '목', '금']) {
    w[day] = data.periods.map((p, i) => ({ period: `${i + 1}교시`, start: p && p.start, n: i + 1 }))
      .filter(p => p.start && !blocked.includes(`${day}${p.n}`))
      .map(p => ({ period: p.period, start: p.start, f: toSec(p.start), t: toSec(p.start) + ATTEND_MIN * 60 }));
  }
  attendWindows = w;
}

async function fetchMissing(a) {
  const d = nowDate();
  const { data, error } = await sb.rpc('missing_students', { p_classname: attendClass, p_date: dateStr(d), p_period: a.period });
  if (error) throw error;
  return (data || []).map(r => r.name);
}

// 안내 창이 떠 있는 동안: 종 치고 FIRST_DELAY 초 뒤 처음, 그 뒤 EVERY 초마다. 0명이 되면 그 교시는 끝.
function pollMissing(t, a) {
  if (!sb || !session) return;
  const key = dateStr(nowDate()) + '|' + a.period;
  if (!poll || poll.key !== key) poll = { key, nextReal: 0, done: false, inFlight: false, data: null, err: null };
  if (poll.done || poll.inFlight) return;
  if (t < a.f + FIRST_DELAY) return;
  if (Date.now() < poll.nextReal) return;
  poll.inFlight = true;
  fetchMissing(a).then(names => { poll.data = names; poll.err = null; if (names.length === 0) poll.done = true; })
    .catch(e => { poll.err = (e && e.message) || String(e); })
    .finally(() => { poll.inFlight = false; poll.nextReal = Date.now() + EVERY * 1000; lastLayout = ''; });
}

// 명단 칸 그리기. 받은 것이 없으면(로그인 전·아직 안 받음) 예전처럼 '출석을 눌러 주세요'.
function renderList(a) {
  const card = $('attend');
  const names = poll && poll.key === dateStr(nowDate()) + '|' + a.period ? poll.data : null;
  if (!names) { card.classList.remove('list'); return; }
  card.classList.add('list');
  const n = names.length;
  $('lsHead').textContent = `📱 ${a.period} 출석`;
  const cnt = $('lsCount'), box = $('lsNames'), hint = $('lsHint');
  if (n === 0) {
    cnt.className = 'cnt ok'; cnt.textContent = '전원 출석 ✓';
    box.style.display = 'none'; hint.style.display = 'flex'; hint.className = 'hint ok'; hint.innerHTML = '모두<br>눌렀습니다';
  } else {
    cnt.className = 'cnt'; cnt.innerHTML = `미출석 <b>${n}</b>명`;
    if (n > NAMES_MAX) {
      box.style.display = 'none'; hint.style.display = 'flex'; hint.className = 'hint'; hint.innerHTML = '자리에 앉아<br>폰에서 출석을<br>눌러 주세요';
    } else {
      hint.style.display = 'none'; box.style.display = 'grid';
      box.className = 'names ' + (n <= 6 ? 'c1' : n <= 18 ? 'c2' : 'c3');
      const key = names.join('|');
      if (box.dataset.key !== key) { box.dataset.key = key; box.innerHTML = names.map(x => `<span>${x.replace(/[<>&]/g, '')}</span>`).join(''); }
    }
  }
  const err = poll.err ? ` <span class="err">· 명단을 못 받았습니다</span>` : '';
  $('lsFoot').innerHTML = (n === 0 ? '' : '폰에서 출석을 눌러 주세요 · ') + `${hm(a.t)}까지` + err;
}

// 로그인: 이름 → 서버 함수로 내부 이메일을 찾아 비밀번호 로그인 (앱과 같은 길)
async function doLogin(name, pw) {
  const { data: email, error: e1 } = await sb.rpc('teacher_login_email', { p_name: name.trim() });
  if (e1 || !email) throw new Error('그 이름의 교직원이 없습니다.');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) throw new Error(error.status === 429 ? '지금 로그인 요청이 몰려 잠시 막혔습니다. 1~2분 뒤 다시.' : '비밀번호가 맞지 않습니다.');
  return data.session;
}
function showLogin(on) { $('login').classList.toggle('on', on); if (on) setTimeout(() => $('lgName').focus(), 0); }
if (sb) {
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); $('lgMsg').textContent = '';
    try { session = await doLogin($('lgName').value, $('lgPw').value); showLogin(false); poll = null; await loadSettings(); }
    catch (err) { $('lgMsg').textContent = err.message; }
  });
  sb.auth.getSession().then(async ({ data }) => {
    session = data.session || null;
    if (session) await loadSettings(); else showLogin(true);
  });
  sb.auth.onAuthStateChange((ev, s) => { session = s || null; if (ev === 'SIGNED_OUT') { poll = null; lastLayout = ''; } });
}



// 글씨를 칸 너비에 맞춰 최대한 크게. 넘치면 줄인다. (화면 높이 × ratio 가 최대)
let K = 1;   // 오른쪽 칸이 세로로 넘칠 때 글씨 전체를 줄이는 배율
function fit(el, ratio) {
  let px = Math.round(innerHeight * ratio * K);
  el.style.fontSize = px + 'px';
  while (el.scrollWidth > el.clientWidth && px > 12) { px -= 2; el.style.fontSize = px + 'px'; }
}
const fitRatio = {};
const fitHtml = {};
function setFit(id, text, ratio, html) {
  const el = document.getElementById(id);
  const key = html === undefined ? text : html;
  if (fitHtml[id] === key && fitRatio[id] === ratio) return;
  if (html === undefined) el.textContent = text; else el.innerHTML = html;
  fitHtml[id] = key; fitRatio[id] = ratio; fit(el, ratio);
}
function refit() { for (const id in fitRatio) fit(document.getElementById(id), fitRatio[id]); }

// 칸 안에 다 들어갈 때까지 글씨를 조금씩 줄인다. 화면 비율·글꼴이 달라도 잘리지 않게.
const overflows = (box) => box.scrollHeight > box.clientHeight + 1;
function fitColumns() {
  const side = $('side'), card = $('attend');
  K = 1; side.style.setProperty('--k', 1); refit();
  while (overflows(side) && K > 0.4) { K -= 0.03; side.style.setProperty('--k', K); refit(); }
  let k2 = 1; card.style.setProperty('--k', 1);
  while (card.classList.contains('on') && overflows(card) && k2 > 0.4) { k2 -= 0.03; card.style.setProperty('--k', k2); }
  const bc = $('bigClock'); let k4 = 1; bc.style.setProperty('--k', 1);
  while (getComputedStyle(bc).display !== 'none' && (overflows(bc) || bc.scrollWidth > bc.clientWidth + 1) && k4 > 0.4) { k4 -= 0.03; bc.style.setProperty('--k', k4); }
  const g = $('guide'); let k3 = 1; g.style.setProperty('--k', 1);
  while (g.classList.contains('on') && overflows(g) && k3 > 0.4) { k3 -= 0.03; g.style.setProperty('--k', k3); }
}
let lastLayout = '';
function fitIfChanged() {
  const key = innerWidth + 'x' + innerHeight + '|' + $('main').innerText + '|' + $('attend').className + $('attend').innerText + '|' + $('guide').className + $('guideNote').innerText + '|' + document.body.className + $('bcNext').innerText;
  if (key !== lastLayout) { lastLayout = key; fitColumns(); }
}
addEventListener('resize', () => { lastLayout = ''; fitIfChanged(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastLayout = ''; fitIfChanged(); });

let lastDigital = '';
function renderDigital(t) {
  const key = hm(t) + ':' + pad(Math.floor(t % 60));
  if (key === lastDigital) return;
  lastDigital = key;
  $('dgTime').textContent = hm(t); $('dgSec').textContent = pad(Math.floor(t % 60));
  $('bcTime').textContent = hm(t); $('bcSec').textContent = pad(Math.floor(t % 60));
  const d = nowDate();
  const ds = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  if ($('bcDate').textContent !== ds) $('bcDate').textContent = ds;
}
// 큰 숫자 시계 판 아래 한 줄: 다음 시험 (실제 시각)
function renderBigNext(st) {
  let h = '';
  if (st.next) h = `<span class="n1">다음 <b>${st.next.name}</b></span><span class="n2">${hm(st.next.p)} 예비령 · ${EXAMS[st.next.i].start} 시작</span>`;
  else if (st.k === 'done') h = '<span class="n1">오늘 시험 끝</span><span class="n2">수고했습니다</span>';
  if ($('bcNext').innerHTML !== h) $('bcNext').innerHTML = h;
}
// 출석 안내가 없을 때 그 칸에 '시계 보는 법'. 맨 아래 한 줄은 지금 상황에 맞춰:
//   휴식 중 → 다음 예비령에 수능 시계가 몇 시로 나오는지 (시험 중에는 없음 — 사용자: 필요 없다)
const noticeToday = () => !!(NOTICE && NOTICE.date === dateStr(nowDate()));
function renderGuide(t, st, on) {
  const nt = noticeToday();
  $('notice').classList.toggle('on', on && nt);
  if (nt && !$('ntQr').innerHTML) { $('ntTitle').textContent = NOTICE.title; $('ntQr').innerHTML = NOTICE.qr; $('ntSub').innerHTML = NOTICE.sub; $('ntUrl').textContent = NOTICE.url; }
  if (nt) on = false;   // 알림이 있는 날은 '시계 보는 법' 대신
  $('guide').classList.toggle('on', on && st.k !== 'done');
  if (!on) return;
  let note = '';
  const nx = st.next;
  if ((st.k === 'break' || st.k === 'lunch' || st.k === 'before') && nx && nx.off)
    note = `<b>${hm(nx.p)}</b> 예비령부터<br>수능 시계(<b>${satHm(nx, nx.p)}</b>)가 나옵니다`;
  if ($('guideNote').innerHTML !== note) $('guideNote').innerHTML = note;
}
function render(t) {
  const st = stateAt(t);
  renderDigital(t);
  drawDial(t, st);
  $('main').className = 's-' + st.k;
  let badge = '', bcls = '', note = '', title = '', sub = '';
  const E = (x) => EXAMS[x.i];

  // 시험 중 글씨는 수능 시각(아날로그와 같은 시각), 휴식 중 글씨는 실제 시각(숫자 시계와 같은 시각). 남은 시간은 쓰지 않는다.
  if (st.k === 'ready') {
    badge = '시험 준비'; bcls = 'b-ready';
    title = `${st.x.name} 영역`;
    sub = `<b>${satHm(st.x, st.x.s)}</b> 시작 · 휴대폰은 가방에`;
  } else if (st.k === 'exam' || st.k === 'warn') {
    badge = '시험 중'; bcls = 'b-exam';
    title = `${st.x.name} 영역`;
    sub = `${satHm(st.x, st.x.s)} ~ <b>${satHm(st.x, st.x.e)}</b>`;
  } else if (st.k === 'ended') {
    badge = '시험 종료'; bcls = 'b-ended';
    title = `${st.x.name} 영역`;
    sub = '<b>시험이 끝났습니다</b><br>필기구를 내려놓으세요';
  } else if (st.k === 'break' || st.k === 'lunch' || st.k === 'before') {
    badge = '휴식 중'; bcls = 'b-rest';
    note = st.k === 'lunch' ? '점심시간' : '';
    title = `다음 ${st.next.name}`;
    sub = `<b>${hm(st.next.p)}</b> 예비령 · ${E(st.next).start} 시작` + (st.k === 'before' ? '' : '<br>교실에서 자습');
  } else {
    badge = '오늘 일정 끝'; bcls = 'b-done';
    title = '시험 끝';
    sub = '<b>오늘 시험이 모두 끝났습니다</b><br>수고했습니다';
  }
  setFit('kicker', badge, 0.075, `<span class="badge ${bcls}">${badge}</span>` + (note ? `<span class="note${bcls === 'b-rest' ? ' calm' : ''}">${note}</span>` : ''));
  setFit('title', title, 0.15);
  $('sub').innerHTML = sub;

  $('strip').innerHTML = exams.map(x => {
    const on = (st.x && st.x.i === x.i) || (st.next && st.next.i === x.i);
    const cls = on ? 'on' : (t >= x.e + ENDED_SHOW ? 'past' : '');
    return `<div class="${cls}"><b>${x.name}</b>${satHm(x, x.s)} ~ ${satHm(x, x.e)}${x.off ? `<i>실제 ${E(x).start} ~ ${E(x).end}</i>` : ''}</div>`;
  }).join('');

  const a = attendAt(t);
  const show = manualAttend === null ? !!a : manualAttend;
  $('attend').classList.toggle('on', show);
  renderGuide(t, st, !show);
  renderBigNext(st);
  if (show) {
    $('attendPeriod').innerHTML = a ? `지금<br>${a.period}` : '부광고ON';
    $('attendUntil').textContent = a ? `${hm(a.t)}까지` : '';
    if (a) { pollMissing(t, a); renderList(a); } else $('attend').classList.remove('list');
  }
  fitIfChanged();
}

// 지난 순간 사이에 지나간 시각이면 종을 친다 (처음 켤 때는 안 친다)
const events = [];
for (const x of exams) events.push({ at: x.p, k: 'yebi' }, { at: x.r, k: 'ready' }, { at: x.s, k: 'start' }, { at: x.e - WARN_BEFORE, k: 'warn' }, { at: x.e, k: 'end' });

let prev = null;
function tick() {
  const t = secOfDay(nowDate());
  if (prev !== null && t > prev && t - prev < 5) {
    for (const ev of events) if (ev.at > prev && ev.at <= t && !(ev.quietInExam && inExam(ev.at))) bell(ev.k);
    // 출석 알림음은 없앴다(2026-10-17 사용자: 필요 없다). 출석 안내는 화면의 노란 칸만.
  }
  prev = t;
  render(t);
}
setInterval(tick, 200 / Math.min(speed, 4));
tick();

// ── 조작 ──
// 파일을 열면 바로 돌아간다. 종소리만은 브라우저 규칙 때문에 화면을 한 번 클릭하거나
// 아무 키나 눌러야 켜진다(그 전에는 왼쪽 아래에 '소리 꺼짐'이 보인다).
async function unlock() {
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); } catch (e) {}
  updateMute();
}
unlock();
try { navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}   // 화면 꺼짐 막기 (되는 브라우저만)
document.addEventListener('click', unlock);
document.addEventListener('keydown', unlock);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'f' || k === 'ㄹ') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  } else if (k === 'l' || k === 'ㅣ') {
    if (!sb) return;
    if (session) { sb.auth.signOut(); session = null; poll = null; showLogin(true); } else showLogin(true);
  } else if (k === 'escape') {
    showLogin(false);
  } else if (k === 's' || k === 'ㄴ') {
    unlock().then(() => bell('start'));
  } else if (k === 'a' || k === 'ㅁ') {
    // 한 번 누르면 지금과 반대로(켜져 있으면 끄고, 꺼져 있으면 켠다), 다시 누르면 시간표대로
    const auto = !!attendAt(secOfDay(nowDate()));
    manualAttend = manualAttend === null ? !auto : null;
    tick();
  }
});
let helpTimer;
document.addEventListener('mousemove', () => {
  $('help').style.opacity = 1; document.body.style.cursor = 'default';
  clearTimeout(helpTimer);
  helpTimer = setTimeout(() => { $('help').style.opacity = 0; document.body.style.cursor = 'none'; }, 3000);
});
updateMute();
</script>
